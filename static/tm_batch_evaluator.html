<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AssureX Teachable Machine Test Evaluator</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 28px; }
    button { padding: 10px 16px; margin: 8px 8px 8px 0; cursor: pointer; }
    progress { width: 100%; height: 20px; }
    pre { background: #f4f4f4; padding: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>AssureX Teachable Machine Test Evaluator</h1>
  <p>This evaluates the exported model against the held-out test cards. It does not train or simulate predictions.</p>
  <button id="run">Evaluate 225 test cards</button>
  <button id="run30">Evaluate the 30-case evidence sample</button>
  <progress id="progress" max="225" value="0"></progress>
  <pre id="status">Ready.</pre>
  <script>
    const MODEL_URL = "/static/teachable_machine/";
    const MANIFEST_URL = "/static/tm_test_manifest.json";
    const labels = {
      "valid claim": "valid_claim",
      "invalid claim": "invalid_claim",
      "manual review": "manual_review"
    };

    function mapLabel(name) {
      const key = name.trim().toLowerCase().replace(/[_-]+/g, " ");
      if (!labels[key]) throw new Error(`Unexpected TM class label: ${name}`);
      return labels[key];
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    async function predictImage(model, item) {
      const image = new Image();
      image.src = item.image_path;
      image.width = 1200;
      image.height = 720;
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error(`Failed to load ${item.image_path}`));
      });
      const predictions = await model.predict(image, false);
      const p = { valid_claim: 0, invalid_claim: 0, manual_review: 0 };
      let top = null;
      for (const entry of predictions) {
        const key = mapLabel(entry.className);
        p[key] = Number(entry.probability);
        if (!top || entry.probability > top.probability) top = { key, probability: Number(entry.probability) };
      }
      return {
        claim_id: item.claim_id,
        actual_class: item.actual_class,
        image_path: item.image_path,
        tm_predicted_class: top.key,
        tm_valid_confidence: p.valid_claim,
        tm_invalid_confidence: p.invalid_claim,
        tm_manual_review_confidence: p.manual_review,
      };
    }

    async function run(limit) {
      const response = await fetch(MANIFEST_URL);
      const manifest = await response.json();
      const items = limit ? manifest.filter((_, i) => {
        // Deterministic 10-per-class sample after the manifest is sorted by claim ID.
        return i < 225 && (
          manifest.filter(x => x.actual_class === manifest[i].actual_class && x.claim_id <= manifest[i].claim_id).length <= 10
        );
      }) : manifest;
      const selected = limit ? items.slice(0, 30) : items;

      document.getElementById("progress").max = selected.length;
      document.getElementById("progress").value = 0;
      const model = await tmImage.load(`${MODEL_URL}model.json`, `${MODEL_URL}metadata.json`);
      const results = [];
      for (let i = 0; i < selected.length; i++) {
        results.push(await predictImage(model, selected[i]));
        document.getElementById("progress").value = i + 1;
        document.getElementById("status").textContent = `Evaluated ${i + 1}/${selected.length}`;
      }

      const columns = ["claim_id","actual_class","image_path","tm_predicted_class","tm_valid_confidence","tm_invalid_confidence","tm_manual_review_confidence"];
      const csv = [columns.join(","), ...results.map(row => columns.map(c => csvCell(row[c])).join(","))].join("\n");
      const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = limit ? "tm_30_predictions.csv" : "tm_test_predictions.csv";
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById("status").textContent = `Completed ${results.length} predictions. CSV downloaded.`;
    }

    document.getElementById("run").onclick = () => run(false).catch(e => document.getElementById("status").textContent = `ERROR: ${e.message}`);
    document.getElementById("run30").onclick = () => run(true).catch(e => document.getElementById("status").textContent = `ERROR: ${e.message}`);
  </script>
</body>
</html>
